[package]
name = "post-office-core"
version = "0.2.0"
edition = "2021"
license = "MIT"
build = "build.rs"

[dependencies]
async-openai = { version = "0.41", features = ["chat-completion", "byot", "model"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
sha2 = "0.10"
keyring = { version = "3", features = ["apple-native", "sync-secret-service"] }
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
reqwest13 = { package = "reqwest", version = "0.13", features = ["json", "rustls"], default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
parking_lot = "0.12"
rverdict-core = { git = "https://github.com/sepatel/rverdict", rev = "aeefa59fe9e4ef1058c86f18eea96ac31efab338" }
rverdict-eval = { git = "https://github.com/sepatel/rverdict", rev = "aeefa59fe9e4ef1058c86f18eea96ac31efab338" }
rverdict-engine = { git = "https://github.com/sepatel/rverdict", rev = "aeefa59fe9e4ef1058c86f18eea96ac31efab338", optional = true }

[features]
# The local decision model (rverdict) and its GPU backends. Without it the
# shadow worker never starts and the app behaves exactly as before.
embedded = ["dep:rverdict-engine"]

[[example]]
name = "verdict"
required-features = ["embedded"]

[build-dependencies]
serde_json = "1"
